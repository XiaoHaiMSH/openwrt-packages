name: sync packages openlist2

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_Sync.yml
    with:
      upstream: https://github.com/sbwml/luci-app-openlist2
      packages: |
        luci-app-openlist2@date
        openlist2
