name: sync packages adguardhome

on:
  schedule:
    - cron: '5 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_Sync.yml
    with:
      upstream: https://github.com/stevenjoezhang/luci-app-adguardhome
      packages: |
        luci-app-adguardhome=.@date
