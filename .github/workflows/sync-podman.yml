name: sync packages podman

on:
  schedule:
    - cron: '25 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_Sync.yml
    with:
      upstream: https://github.com/Zerogiven-OpenWRT-Packages/luci-app-podman
      packages: |
        luci-app-podman=.@date
