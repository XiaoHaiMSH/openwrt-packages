name: sync packages lucky

on:
  schedule:
    - cron: '10 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_Sync.yml
    with:
      upstream: https://github.com/gdy666/luci-app-lucky
      packages: |
        luci-app-lucky@date
        lucky
